events { worker_connections 1024; }

http {
    upstream kasir_minimarket {
        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://kasir_minimarket;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
